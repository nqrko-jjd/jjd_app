# Vhost JJD à ajouter au nginx de Bricoloc (même VPS).
# Copier ce fichier dans la conf nginx de Bricoloc, p.ex. :
#   cp deploy/nginx/jjd-consult.be.conf  <bricoloc>/deploy/nginx/jjd-consult.be.conf
# puis le monter dans le service nginx de Bricoloc :
#   - ./deploy/nginx/jjd-consult.be.conf:/etc/nginx/conf.d/jjd-consult.be.conf:ro
# et attacher ce service nginx au réseau « edge » (voir docs/deploiement.md).

upstream jjd_web { server jjd-web:3000; }
upstream jjd_api { server jjd-api:4100; }

# ---------- HTTP : ACME + redirection HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name jjd-consult.be www.jjd-consult.be;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://jjd-consult.be$request_uri; }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jjd-consult.be;
    ssl_certificate     /etc/letsencrypt/live/jjd-consult.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjd-consult.be/privkey.pem;
    return 301 https://jjd-consult.be$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jjd-consult.be;

    ssl_certificate     /etc/letsencrypt/live/jjd-consult.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjd-consult.be/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Médias (photos de chantier, PDF) : servis par l'API JJD.
    location /uploads/ {
        proxy_pass http://jjd_api/uploads/;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
    }

    # API JJD : /jjd-api/xxx -> jjd-api:4100/xxx
    location /jjd-api/ {
        proxy_pass http://jjd_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Site Next.js (vitrine + /app + /portail)
    location / {
        proxy_pass http://jjd_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
