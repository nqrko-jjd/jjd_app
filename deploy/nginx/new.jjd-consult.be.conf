# Vhost JJD — monté dans le nginx de Bricoloc (même VPS), réseau Docker « edge ».
#   Bricoloc docker-compose.yml (service nginx) :
#     volumes: - /opt/jjd/deploy/nginx/new.jjd-consult.be.conf:/etc/nginx/conf.d/new.jjd-consult.be.conf:ro
#     networks: [default, edge]
# Phase de test : sous-domaine new.jjd-consult.be. Le site principal reste ailleurs.

# Limites de requêtes : connexion et formulaires publics (anti essais de mots de passe / spam), API en général.
limit_req_zone $binary_remote_addr zone=jjd_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jjd_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=jjd_conn:10m;

upstream jjd_web { server jjd-web:3000; }
upstream jjd_api { server jjd-api:4100; }

# ---------- HTTP : ACME + redirection HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name new.jjd-consult.be demo.jjd-consult.be;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name new.jjd-consult.be;

    ssl_certificate     /etc/letsencrypt/live/new.jjd-consult.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.jjd-consult.be/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 15m;
    server_tokens off;

    # En-têtes de sécurité (à répéter dans un location qui définirait ses propres add_header).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    # CSP en mode « rapport » d'abord (ne bloque rien) : on vérifie dans la console du navigateur, puis on passe en Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Connexion, lien magique du portail, formulaires publics : 10 requêtes / minute / visiteur (rafale de 10).
    location ~ ^/jjd-api/api/(auth/login|portal/request-link|portal/verify|public/) {
        limit_req zone=jjd_auth burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/jjd-api/(.*)$ /$1 break;
        proxy_pass http://jjd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Médias JJD (photos de chantier, PDF) : servis par l'API JJD.
    location /uploads/ {
        proxy_pass http://jjd_api/uploads/;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
    }

    # WhatsApp : 500 Mio côté API + marge multipart côté proxy.
    location ~ ^/jjd-api/api/worksites/[^/]+/thread/import-whatsapp$ {
        client_max_body_size 501m;
        limit_conn jjd_conn 3;
        rewrite ^/jjd-api/(.*)$ /$1 break;
        proxy_pass http://jjd_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Autres pièces jointes de chantier : limite existante de 300 Mio.
    location ~ ^/jjd-api/api/worksites/[^/]+/files$ {
        client_max_body_size 300m;
        limit_conn jjd_conn 3;
        rewrite ^/jjd-api/(.*)$ /$1 break;
        proxy_pass http://jjd_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # API JJD : /jjd-api/xxx -> jjd-api:4100/xxx
    # Separate database/uploads/credentials; dynamic DNS keeps the main site
    # available when the optional review service is stopped.
    location /jjd-demo-api/ {
        resolver 127.0.0.11 valid=30s;
        set $review_api http://jjd-review-api:4100;
        rewrite ^/jjd-demo-api/(.*)$ /$1 break;
        proxy_pass $review_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /jjd-api/ {
        limit_req zone=jjd_api burst=100 nodelay;
        limit_conn jjd_conn 40;
        proxy_pass http://jjd_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Site Next.js (vitrine + /app + /portail)
    location / {
        proxy_pass http://jjd_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------- Démo commerciale : demo.jjd-consult.be (pile docker-compose.demo.yml, base séparée) ----------
# Certificat chargé à la connexion ($ssl_server_name) et conteneurs résolus à la volée : nginx démarre même si le
# certificat n'existe pas encore ou si la démo est arrêtée — le site principal et Bricoloc ne sont jamais bloqués.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.jjd-consult.be;

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 valid=30s;
    set $demo_web http://jjd-demo-web:3000;
    set $demo_api http://jjd-demo-api:4100;

    location ~ ^/jjd-api/api/(auth/login|portal/request-link|portal/verify|public/) {
        limit_req zone=jjd_auth burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/jjd-api/(.*)$ /$1 break;
        proxy_pass $demo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass $demo_api;
        proxy_set_header Host $host;
    }
    location /jjd-api/ {
        limit_req zone=jjd_api burst=100 nodelay;
        rewrite ^/jjd-api/(.*)$ /$1 break;
        proxy_pass $demo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass $demo_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
